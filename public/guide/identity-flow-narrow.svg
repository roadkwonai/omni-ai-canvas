<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 642" width="320" height="642" role="img" aria-labelledby="identity-flow-narrow-title identity-flow-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="identity-flow-narrow-title">외형과 목소리를 이어 쓰는 길</title><desc id="identity-flow-narrow-desc">Soul 번호는 이미지 요청에만 붙는다. 영상에는 기준 이미지를 인물 외형으로 연결한다.</desc><rect width="320" height="642" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">인물 사진</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">5~20장</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><rect x="1" y="106" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">Soul 학습</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">크레딧이 들어요</text><path d="M160 166V200" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 193L160 202L166 193Z" fill="#1a1c20"/><rect x="1" y="204" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="229" font-size="17" font-weight="700" fill="#1a1c20">기준 이미지</text><text x="16" y="250" font-size="14" font-weight="400" fill="#555d6d">시트에 적용</text><path d="M160 264V298" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 291L160 300L166 291Z" fill="#1a1c20"/><rect x="1" y="302" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="327" font-size="17" font-weight="700" fill="#1a1c20">캐릭터 시트</text><text x="16" y="348" font-size="14" font-weight="400" fill="#555d6d">영상에 연결해요</text><rect x="1" y="380" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="405" font-size="17" font-weight="700" fill="#1a1c20">목소리 샘플</text><text x="16" y="426" font-size="14" font-weight="400" fill="#555d6d">11 MiB까지</text><path d="M160 440V474" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 467L160 476L166 467Z" fill="#1a1c20"/><rect x="1" y="478" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="503" font-size="17" font-weight="700" fill="#1a1c20">목소리 등록</text><text x="16" y="524" font-size="14" font-weight="400" fill="#555d6d">권한 확인</text><path d="M160 538V572" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 565L160 574L166 565Z" fill="#1a1c20"/><rect x="1" y="576" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="601" font-size="17" font-weight="700" fill="#1a1c20">내레이션</text><text x="16" y="622" font-size="14" font-weight="400" fill="#555d6d">음향 큐</text></svg>
