<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 504" width="320" height="504" role="img" aria-labelledby="run-state-narrow-title run-state-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="run-state-narrow-title">생성 실행 상태</title><desc id="run-state-narrow-desc">생존 신호가 60분 없으면 만료한다. Road Music은 180분이다. 결과는 .scene-room/run-outbox에 먼저 적고 데이터베이스에 반영한다.</desc><rect width="320" height="504" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">대기 중</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">요청을 저장했어요</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><text x="176" y="90" font-size="14" font-weight="400" fill="#1a1c20">실행기 시작</text><rect x="1" y="106" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">생성 중</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">서비스나 로컬 엔진</text><path d="M18 166V183H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="188" font-size="14" font-weight="400" fill="#555d6d">오류 → 실패</text><path d="M18 190V207H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="212" font-size="14" font-weight="400" fill="#555d6d">60분 무응답 → 만료된 실패</text><path d="M160 220V254" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 247L160 256L166 247Z" fill="#1a1c20"/><text x="176" y="242" font-size="14" font-weight="400" fill="#1a1c20">결과 도착</text><rect x="1" y="258" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="283" font-size="17" font-weight="700" fill="#1a1c20">완료</text><text x="16" y="304" font-size="14" font-weight="400" fill="#555d6d">결과 적용을 눌러요</text><rect x="1" y="336" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="361" font-size="17" font-weight="700" fill="#1a1c20">실패</text><text x="16" y="382" font-size="14" font-weight="400" fill="#555d6d">오류 문구를 봐요</text><rect x="1" y="414" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="439" font-size="17" font-weight="700" fill="#1a1c20">만료된 실패</text><text x="16" y="460" font-size="14" font-weight="400" fill="#555d6d">응답을 잃었어요</text><path d="M18 474V491H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="496" font-size="14" font-weight="400" fill="#555d6d">보관 결과 도착 → 완료</text></svg>
