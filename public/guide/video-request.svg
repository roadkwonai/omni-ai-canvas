<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 400" width="712" height="400" role="img" aria-labelledby="video-request-title video-request-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="video-request-title">영상 한 편을 만드는 순서</title><desc id="video-request-desc">필요한 참조가 비어 있으면 생성 버튼이 꺼지고 이유가 나온다.</desc><rect width="712" height="400" fill="#ffffff"/><style>
