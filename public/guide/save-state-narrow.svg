<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 548" width="320" height="548" role="img" aria-labelledby="save-state-narrow-title save-state-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="save-state-narrow-title">프로젝트 저장 상태</title><desc id="save-state-narrow-desc">저장이 끝난 뒤 저장 대기로 돌아가 한 번 더 저장한다. 내 작업 내보내기로 JSON을 받은 뒤 저장본을 불러온다.</desc><rect width="320" height="548" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">저장됨</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">서버에 반영됐어요</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><text x="176" y="90" font-size="14" font-weight="400" fill="#1a1c20">편집</text><rect x="1" y="106" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">저장 대기</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">편집이 멈추길 기다려요</text><path d="M160 166V200" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 193L160 202L166 193Z" fill="#1a1c20"/><text x="176" y="188" font-size="14" font-weight="400" fill="#1a1c20">0.9초 뒤</text><rect x="1" y="204" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="229" font-size="17" font-weight="700" fill="#1a1c20">저장 중</text><text x="16" y="250" font-size="14" font-weight="400" fill="#555d6d">서버로 보내고 있어요</text><path d="M18 264V281H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="286" font-size="14" font-weight="400" fill="#555d6d">성공 → 저장됨</text><path d="M18 288V305H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="310" font-size="14" font-weight="400" fill="#555d6d">버전 다름 → 저장 충돌</text><path d="M160 318V352" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 345L160 354L166 345Z" fill="#1a1c20"/><text x="176" y="340" font-size="14" font-weight="400" fill="#1a1c20">오류</text><rect x="1" y="356" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="381" font-size="17" font-weight="700" fill="#1a1c20">저장 실패</text><text x="16" y="402" font-size="14" font-weight="400" fill="#555d6d">연결이나 형식 오류</text><path d="M18 416V433H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="438" font-size="14" font-weight="400" fill="#555d6d">다시 저장 → 저장 중</text><rect x="1" y="458" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="483" font-size="17" font-weight="700" fill="#1a1c20">저장 충돌</text><text x="16" y="504" font-size="14" font-weight="400" fill="#555d6d">다른 창이 먼저 저장</text><path d="M18 518V535H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="540" font-size="14" font-weight="400" fill="#555d6d">저장본 불러오기 → 저장됨</text></svg>
