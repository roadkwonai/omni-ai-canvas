<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="320" height="500" role="img" aria-labelledby="image-edit-flow-narrow-title image-edit-flow-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="image-edit-flow-narrow-title">이미지 연출 순서</title><desc id="image-edit-flow-narrow-desc">연출 10종은 Codex나 설정에서 허용한 이미지 API가 한 번에 한 장을 그린다. 업스케일, 회전, 주석, 레이어, 시트 분할은 비용 없이 이 컴퓨터에서 처리한다.</desc><rect width="320" height="500" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">원본 이미지</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">10 MiB 이하</text><path d="M18 68V85H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="90" font-size="14" font-weight="400" fill="#555d6d">도구 → 편집 도구</text><path d="M160 98V132" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 125L160 134L166 125Z" fill="#1a1c20"/><text x="176" y="120" font-size="14" font-weight="400" fill="#1a1c20">연출</text><rect x="1" y="136" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="161" font-size="17" font-weight="700" fill="#1a1c20">편집 노드</text><text x="16" y="182" font-size="14" font-weight="400" fill="#555d6d">설정을 저장해요</text><path d="M160 196V230" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 223L160 232L166 223Z" fill="#1a1c20"/><text x="176" y="218" font-size="14" font-weight="400" fill="#1a1c20">생성</text><rect x="1" y="234" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="259" font-size="17" font-weight="700" fill="#1a1c20">후보 비교</text><text x="16" y="280" font-size="14" font-weight="400" fill="#555d6d">최대 4개</text><path d="M160 294V328" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 321L160 330L166 321Z" fill="#1a1c20"/><text x="176" y="316" font-size="14" font-weight="400" fill="#1a1c20">채택</text><rect x="1" y="332" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="357" font-size="17" font-weight="700" fill="#1a1c20">채택한 결과</text><text x="16" y="378" font-size="14" font-weight="400" fill="#555d6d">다음 작업에 써요</text><rect x="1" y="410" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="435" font-size="17" font-weight="700" fill="#1a1c20">편집 도구</text><text x="16" y="456" font-size="14" font-weight="400" fill="#555d6d">확대·회전·주석</text><path d="M18 470V487H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="492" font-size="14" font-weight="400" fill="#555d6d">저장 → 채택한 결과</text></svg>
