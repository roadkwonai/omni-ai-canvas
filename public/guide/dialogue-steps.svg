<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="dialogue-steps-title dialogue-steps-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="dialogue-steps-title">대사를 음성으로 만드는 순서</title><desc id="dialogue-steps-desc">대사 노드에서 화자를 나누고 목소리를 고른 다음, AI 연기 지시를 검토하고 음성을 만들어 타임라인에 넣는 여섯 단계입니다.</desc><rect width="1280" height="424" fill="#ffffff"/><text x="80" y="84" font-size="34" font-weight="700" fill="#1a1c20" text-anchor="start">대사를 음성으로 만드는 순서</text><text x="80" y="122" font-size="20" font-weight="400" fill="#555d6d" text-anchor="start">대본을 줄 단위로 다듬어 컷에 넣어요</text><rect x="88" y="200" width="184" height="48" fill="#1a1c20" fill-opacity="0.05" data-role="rail" data-step="s1" data-index="1"/><rect x="272" y="200" width="184" height="48" fill="#1a1c20" fill-opacity="0.09" data-role="rail" data-step="s2" data-index="2"/><rect x="456" y="200" width="184" height="48" fill="#1a1c20" fill-opacity="0.05" data-role="rail" data-step="s3" data-index="3"/><rect x="640" y="200" width="184" height="48" fill="#ff6600" fill-opacity="0.16" data-role="rail" data-step="s4" data-index="4" data-focal='true'/><rect x="824" y="200" width="184" height="48" fill="#1a1c20" fill-opacity="0.05" data-role="rail" data-step="s5" data-index="5"/><rect x="1008" y="200" width="184" height="48" fill="#1a1c20" fill-opacity="0.09" data-role="rail" data-step="s6" data-index="6"/><circle cx="180" cy="224" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5" data-role="medallion" data-step="s1"/><text x="180" y="231" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="middle" data-role="number" data-step="s1">01</text><text x="180" y="308" font-size="23" font-weight="700" fill="#1a1c20" text-anchor="middle">대사 노드</text><text x="180" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">대본을 붙여 넣거나</text><text x="180" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">직접 적어요</text><circle cx="364" cy="224" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5" data-role="medallion" data-step="s2"/><text x="364" y="231" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="middle" data-role="number" data-step="s2">02</text><text x="364" y="308" font-size="23" font-weight="700" fill="#1a1c20" text-anchor="middle">화자 나누기</text><text x="364" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">줄마다 화자 이름이</text><text x="364" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">색 태그로 붙어요</text><circle cx="548" cy="224" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5" data-role="medallion" data-step="s3"/><text x="548" y="231" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="middle" data-role="number" data-step="s3">03</text><text x="548" y="308" font-size="23" font-weight="700" fill="#1a1c20" text-anchor="middle">목소리 고르기</text><text x="548" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">화자마다 목소리를</text><text x="548" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">정해요</text><circle cx="732" cy="224" r="36" fill="#ffffff" stroke="#ff6600" stroke-width="3" data-role="medallion" data-step="s4" data-focal='true'/><text x="732" y="231" font-size="20" font-weight="700" fill="#b93901" text-anchor="middle" data-role="number" data-step="s4">04</text><text x="732" y="308" font-size="23" font-weight="700" fill="#b93901" text-anchor="middle">AI 연기 지시</text><text x="732" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">줄마다 말투와 쉼,</text><text x="732" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">소리를 제안해요</text><circle cx="916" cy="224" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5" data-role="medallion" data-step="s5"/><text x="916" y="231" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="middle" data-role="number" data-step="s5">05</text><text x="916" y="308" font-size="23" font-weight="700" fill="#1a1c20" text-anchor="middle">만들고 듣기</text><text x="916" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">마음에 안 드는 줄만</text><text x="916" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">다시 만들어요</text><circle cx="1100" cy="224" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5" data-role="medallion" data-step="s6"/><text x="1100" y="231" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="middle" data-role="number" data-step="s6">06</text><text x="1100" y="308" font-size="23" font-weight="700" fill="#1a1c20" text-anchor="middle">타임라인</text><text x="1100" y="344" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">고른 음성을</text><text x="1100" y="370" font-size="18" font-weight="400" fill="#555d6d" text-anchor="middle">컷에 넣어요</text></svg>