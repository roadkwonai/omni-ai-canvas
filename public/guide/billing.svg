<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="656" viewBox="0 0 1300 656" font-family="&#39;Pretendard Variable&#39;, Pretendard, &#39;Apple SD Gothic Neo&#39;, &#39;Noto Sans KR&#39;, &#39;Malgun Gothic&#39;, system-ui, -apple-system, sans-serif" color="#14171B"><rect width="1300" height="656" fill="#FFFFFF"/><svg x="24" y="24" width="1252" height="608" viewBox="0 0 1252 608" overflow="visible"><title id="_R_0_t">생성 경로와 과금 경계</title><desc id="_R_0_d">구독 CLI, 별도 API, 외부 앱과 로컬 Road Music·FFmpeg 실행을 구분합니다. 로컬 실행에는 외부 생성 서비스 요금이 없습니다.</desc><g><rect width="1252" height="608" fill="transparent"></rect><g class="ztd-mark"><g fill="none" stroke-linecap="round"><path d="M130.4,327.1C356.1,327.1 356.1,96.3 581.8,96.3" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M581.8,96.3C807.5,96.3 807.5,50.2 1033.2,50.2" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M581.8,96.3C807.5,96.3 807.5,142.5 1033.2,142.5" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M130.4,327.1C356.1,327.1 356.1,280.9 581.8,280.9" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M581.8,280.9C807.5,280.9 807.5,280.9 1033.2,280.9" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M130.4,327.1C356.1,327.1 356.1,419.4 581.8,419.4" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M581.8,419.4C807.5,419.4 807.5,419.4 1033.2,419.4" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M130.4,327.1C356.1,327.1 356.1,557.8 581.8,557.8" stroke="#D5DAE0" stroke-width="1.3"></path><path d="M581.8,557.8C807.5,557.8 807.5,557.8 1033.2,557.8" stroke="#D5DAE0" stroke-width="1.3"></path></g><g><circle cx="130.4" cy="327.1" r="5.5" fill="#14171B"></circle><circle cx="581.8" cy="96.3" r="4" fill="#14171B"></circle><circle cx="1033.2" cy="50.2" r="3" fill="#9AA3AE"></circle><circle cx="1033.2" cy="142.5" r="3" fill="#9AA3AE"></circle><circle cx="581.8" cy="280.9" r="4" fill="#14171B"></circle><circle cx="1033.2" cy="280.9" r="3" fill="#9AA3AE"></circle><circle cx="581.8" cy="419.4" r="4" fill="#14171B"></circle><circle cx="1033.2" cy="419.4" r="3" fill="#9AA3AE"></circle><circle cx="581.8" cy="557.8" r="4" fill="#14171B"></circle><circle cx="1033.2" cy="557.8" r="3" fill="#9AA3AE"></circle></g><g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke" style="pointer-events:none"><text x="119.9" y="327.1" dy="0.35em" text-anchor="end" font-size="12" font-weight="700" fill="#14171B">제작자가 실행 경로 선택</text><text x="572.8" y="96.3" dy="0.35em" text-anchor="end" font-size="11" font-weight="600" fill="#14171B">구독 계정 CLI</text><text x="1041.2" y="50.2" dy="0.35em" text-anchor="start" font-size="11" font-weight="500" fill="#5D6570">Codex · Claude 구독 사용량</text><text x="1041.2" y="142.5" dy="0.35em" text-anchor="start" font-size="11" font-weight="500" fill="#5D6570">Higgsfield · Kling 크레딧</text><text x="572.8" y="280.9" dy="0.35em" text-anchor="end" font-size="11" font-weight="600" fill="#14171B">별도 API를 명시 선택</text><text x="1041.2" y="280.9" dy="0.35em" text-anchor="start" font-size="11" font-weight="500" fill="#5D6570">이미지 API 별도 과금</text><text x="572.8" y="419.4" dy="0.35em" text-anchor="end" font-size="11" font-weight="600" fill="#14171B">외부 앱에서 직접 제작</text><text x="1041.2" y="419.4" dy="0.35em" text-anchor="start" font-size="11" font-weight="500" fill="#5D6570">계정별 과금 확인 후 가져오기</text><text x="572.8" y="557.8" dy="0.35em" text-anchor="end" font-size="11" font-weight="600" fill="#14171B">로컬 도구 실행</text><text x="1041.2" y="557.8" dy="0.35em" text-anchor="start" font-size="11" font-weight="500" fill="#5D6570">Road Music · FFmpeg 외부 생성료 없음</text></g></g></g></svg></svg>