<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 298" width="720" height="298" role="img" aria-labelledby="timeline-anatomy-title timeline-anatomy-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="timeline-anatomy-title">타임라인의 세 줄</title><desc id="timeline-anatomy-desc">컷, 음향, 자막이 같은 시간을 나눠 씁니다. 디졸브를 넣으면 두 컷이 겹친 만큼 전체 길이가 줄어듭니다. 3초 컷 두 개에 0.5초 디졸브를 넣으면 5.5초입니다.</desc><rect width="720" height="298" fill="#ffffff"/><path d="M96.0 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="96.0" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="start">0초</text><path d="M205.0909090909091 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="205.0909090909091" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">1초</text><path d="M314.1818181818182 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="314.1818181818182" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">2초</text><path d="M423.27272727272725 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="423.27272727272725" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">3초</text><path d="M532.3636363636364 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="532.3636363636364" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">4초</text><path d="M641.4545454545455 34V250" stroke="#d1d3d8" stroke-width="1"/><text x="641.4545454545455" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">5초</text><text x="16" y="76" font-size="16" font-weight="700" fill="#1a1c20" text-anchor="start">컷</text><rect x="96.0" y="46" width="327.27272727272725" height="46" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="368.72727272727275" y="46" width="327.27272727272725" height="46" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="368.72727272727275" y="46" width="54.54545454545455" height="46" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="216.0" y="75" font-size="15" font-weight="600" fill="#1a1c20" text-anchor="middle">컷 1 · 3초</text><text x="565.090909090909" y="75" font-size="15" font-weight="600" fill="#1a1c20" text-anchor="middle">컷 2 · 3초</text><text x="396.0" y="112" font-size="13" font-weight="600" fill="#b93901" text-anchor="middle">디졸브 0.5초</text><text x="16" y="158" font-size="16" font-weight="700" fill="#1a1c20" text-anchor="start">음향</text><rect x="117.81818181818181" y="128" width="218.1818181818182" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="270.54545454545456" y="168" width="403.6363636363637" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="226.9090909090909" y="151" font-size="14" font-weight="600" fill="#1a1c20" text-anchor="middle">대사</text><text x="466.90909090909093" y="191" font-size="14" font-weight="600" fill="#1a1c20" text-anchor="middle">음악</text><text x="16" y="246" font-size="16" font-weight="700" fill="#1a1c20" text-anchor="start">자막</text><rect x="117.81818181818181" y="216" width="76.36363636363636" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="156.0" y="239" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">오늘이</text><rect x="199.63636363636363" y="216" width="98.18181818181819" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="248.72727272727272" y="239" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">마지막</text><rect x="303.27272727272725" y="216" width="98.18181818181819" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="352.3636363636364" y="239" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">필름</text><text x="96" y="282" font-size="16" font-weight="700" fill="#b93901" text-anchor="start">3초 + 3초 − 0.5초 = 5.5초</text></svg>