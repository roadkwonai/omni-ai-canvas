<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="320" height="500" role="img" aria-labelledby="mcp-flow-narrow-title mcp-flow-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="mcp-flow-narrow-title">외부 에이전트가 노드를 더하는 순서</title><desc id="mcp-flow-narrow-desc">읽은 뒤 보드가 바뀌었으면 추가하지 않고 다시 읽게 한다.</desc><rect width="320" height="500" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">프로젝트 목록</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">list_projects</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><rect x="1" y="106" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">보드 읽기</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">get_project</text><path d="M160 166V200" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 193L160 202L166 193Z" fill="#1a1c20"/><text x="176" y="188" font-size="14" font-weight="400" fill="#1a1c20">버전</text><rect x="1" y="204" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="229" font-size="17" font-weight="700" fill="#1a1c20">노드 추가</text><text x="16" y="250" font-size="14" font-weight="400" fill="#555d6d">apply_graph</text><path d="M18 264V281H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="286" font-size="14" font-weight="400" fill="#555d6d">바뀐 버전 → 버전 충돌</text><path d="M160 294V328" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 321L160 330L166 321Z" fill="#1a1c20"/><text x="176" y="316" font-size="14" font-weight="400" fill="#1a1c20">같은 버전</text><rect x="1" y="332" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="1