<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">이미지 노드 편집 흐름</title>
<desc id="desc">원본 이미지 도구 모음, 감정 노드 편집, 조명 편집기의 독립적인 세 화면을 제시한 제안 와이어프레임이다.</desc>
<style>
text{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#252a32}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#586579}.panel{fill:#fff;stroke:#d7dce3;stroke-width:2}.soft{fill:#f6f7f9;stroke:#e2e5eb}.accent{fill:#fff0e9;stroke:#cf4a08}.line{fill:none;stroke:#75859b;stroke-width:2}.orange{fill:none;stroke:#bd3d00;stroke-width:3}.dot{fill:#bd3d00}.guide{fill:#edf1f5;stroke:#a6b2c1}.button{fill:#fff;stroke:#b4bdc8}.pill{fill:#fff0e9;stroke:#d66328}
</style>
<rect width="1440" height="1080" fill="#f4f5f7"/>
<text x="46" y="52" class="title">이미지 노드에서 연출을 시작하는 흐름</text>
<text x="46" y="80" class="small">기능과 상호작용을 설명하는 개념도</text>
<rect x="32" y="105" width="666" height="420" rx="18" class="panel"/>
<text x="55" y="140" class="head">이미지를 선택하면 도구가 나타남</text>
<rect x="88" y="165" width="555" height="58" rx="12" class="panel"/>
<g class="label"><text x="108" y="201">인물</text><text x="196" y="201">조명</text><text x="284" y="201">카메라</text><text x="391" y="201">시트</text><text x="485" y="201">업스케일</text><text x="573" y="201">더보기</text></g>
<rect x="227" y="250" width="246" height="242" rx="12" class="accent"/>
<rect x="244" y="267" width="212" height="158" rx="8" class="guide"/>
<circle cx="350" cy="318" r="27" fill="#abb7c5"/><path d="M302 408q48-81 96 0" fill="#abb7c5"/>
<text x="246" y="456" class="label">원본 이미지</text><text x="246" y="478" class="small">선택한 이미지 노드</text>
<circle cx="476" cy="374" r="13" fill="#fff" stroke="#bd3d00" stroke-width="2"/><text x="471" y="380" class="label">+</text>
<rect x="722" y="105" width="686" height="420" rx="18" class="panel"/>
<text x="745" y="140" class="head">감정 도구를 선택해 연결된 편집 노드 생성</text>
<rect x="749" y="188" width="133" height="127" rx="10" class="soft"/>
<circle cx="815" cy="230" r="19" fill="#abb7c5"/><path d="M779 291q36-62 72 0" fill="#abb7c5"/><text x="769" y="339" class="small">원본 이미지</text>
<path d="M882 251 C912 251 917 251 944 251" class="orange"/>
<rect x="944" y="188" width="160" height="127" rx="10" class="accent"/>
<text x="964" y="218" class="label">감정 조정</text><text x="964" y="245" class="small">입력과 설정 보존</text><text x="964" y="269" class="small">편집 초안</text>
<rect x="1120" y="166" width="265" height="328" rx="12" class="panel"/>
<text x="1138" y="194" class="label">감정 조정 편집기</text>
<ellipse cx="1191" cy="278" rx="37" ry="51" fill="#c8ced5"/><circle cx="1179" cy="269" r="3"/><circle cx="1203" cy="269" r="3"/><path d="M1179 292q12 6 24 0" class="line"/>
<text x="1260" y="227" class="small">흥분</text><text x="1234" y="397" class="small">평온</text>
<g fill="#8d99a8">
<circle cx="1245" cy="245" r="4"/><circle cx="1265" cy="245" r="4"/><circle cx="1285" cy="245" r="4"/><circle cx="1305" cy="245" r="4"/><circle cx="1325" cy="245" r="4"/>
<circle cx="1245" cy="265" r="4"/><circle cx="1265" cy="265" r="4"/><circle cx="1285" cy="265" r="4"/><circle cx="1305" cy="265" r="4"/><circle cx="1325" cy="265" r="4"/>
<circle cx="1245" cy="285" r="4"/><circle cx="1265" cy="285" r="4"/><circle cx="1285" cy="285" r="7" class="dot"/><circle cx="1305" cy="285" r="4"/><circle cx="1325" cy="285" r="4"/>
<circle cx="1245" cy="305" r="4"/><circle cx="1265" cy="305" r="4"/><circle cx="1285" cy="305" r="4"/><circle cx="1305" cy="305" r="4"/><circle cx="1325" cy="305" r="4"/>
<circle cx="1245" cy="325" r="4"/><circle cx="1265" cy="325" r="4"/><circle cx="1285" cy="325" r="4"/><circle cx="1305" cy="325" r="4"/><circle cx="1325" cy="325" r="4"/>
</g>
<text x="1233" y="356" class="small">친밀 ← → 거리감</text>
<rect x="1138" y="414" width="229" height="30" rx="6" class="soft"/><text x="1148" y="434" class="small">프롬프트와 모델 선택</text>
<text x="1174" y="473" class="small">설정 저장</text><rect x="1270" y="454" width="95" height="28" rx="7" class="pill"/><text x="1303" y="473" class="small">생성</text>
<rect x="32" y="548" width="1376" height="490" rx="18" class="panel"/>
<text x="55" y="585" class="head">조명 편집기는 원본을 보며 광원 위치와 결과를 조정</text>
<rect x="70" y="614" width="487" height="365" rx="12" class="soft"/>
<circle cx="313" cy="796" r="144" fill="#e1e7ed" stroke="#a9b6c5" stroke-width="2"/>
<path d="M169 796h288 M313 652v288 M212 694q100 80 202 204 M414 694q-100 80-202 204" class="line" opacity=".5"/>
<rect x="258" y="756" width="110" height="78" rx="5" fill="#b3beca"/><circle cx="313" cy="781" r="12" fill="#8a99aa"/><path d="M285 825q28-46 56 0" fill="#8a99aa"/>
<path d="M430 719L353 770" class="orange"/><circle cx="430" cy="719" r="11" class="dot"/>
<text x="88" y="645" class="small">투시 / 정면 보기</text><text x="239" y="966" class="small">광원 핸들을 이동</text>
<rect x="585" y="614" width="373" height="365" rx="12" class="panel"/>
<text x="608" y="648" class="label">주광 방향</text>
<rect x="610" y="666" width="84" height="36" rx="7" class="button"/><text x="630" y="690" class="small">왼쪽</text>
<rect x="702" y="666" width="84" height="36" rx="7" class="button"/><text x="728" y="690" class="small">위</text>
<rect x="794" y="666" width="84" height="36" rx="7" class="pill"/><text x="814" y="690" class="small">오른쪽</text>
<text x="608" y="742" class="small">밝기</text><path d="M666 738h215" class="line"/><circle cx="770" cy="738" r="8" class="dot"/>
<text x="608" y="784" class="small">색상</text><rect x="664" y="766" width="56" height="26" rx="4" fill="#ffe1bf" stroke="#bdc7d3"/>
<text x="608" y="825" class="small">림라이트</text><rect x="806" y="807" width="66" height="29" rx="14" class="pill"/><circle cx="854" cy="821" r="10" fill="#bd3d00"/>
<rect x="608" y="865" width="321" height="38" rx="7" class="soft"/><text x="620" y="889" class="small">추가 지시와 모델 선택</text>
<rect x="1017" y="614" width="350" height="365" rx="12" class="panel"/>
<text x="1040" y="648" class="label">스마트 조명</text><text x="1040" y="678" class="small">룩 설명 또는 참조 이미지</text>
<rect x="1040" y="694" width="301" height="75" rx="8" class="soft"/><text x="1055" y="723" class="small">원하는 빛과 분위기</text>
<text x="1040" y="806" class="small">프리셋</text>
<rect x="1040" y="821" width="91" height="62" rx="8" fill="#dbe5ee"/><rect x="1144" y="821" width="91" height="62" rx="8" fill="#e6ddd0"/><rect x="1248" y="821" width="91" height="62" rx="8" fill="#d8dadd"/>
<text x="1052" y="874" class="small">차가운 빛</text><text x="1157" y="874" class="small">따뜻한 빛</text><text x="1261" y="874" class="small">명암 강조</text>
<text x="1150" y="947" class="small">설정 저장</text><rect x="1235" y="923" width="107" height="37" rx="7" class="pill"/><text x="1275" y="947" class="small">생성</text>
</svg>
