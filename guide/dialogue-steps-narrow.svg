<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 904" width="640" height="904" role="img" aria-labelledby="dialogue-steps-narrow-title dialogue-steps-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="dialogue-steps-narrow-title">대사를 음성으로 만드는 순서</title><desc id="dialogue-steps-narrow-desc">대사 노드에서 화자를 나누고 목소리를 고른 다음, AI 연기 지시를 검토하고 음성을 만들어 타임라인에 넣는 여섯 단계입니다.</desc><rect width="640" height="904" fill="#ffffff"/><text x="32" y="64" font-size="34" font-weight="700" fill="#1a1c20" text-anchor="start">대사를 음성으로 만드는 순서</text><text x="32" y="104" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">대본을 줄 단위로</text><text x="32" y="134" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">다듬어 컷에 넣어요</text><rect x="60" y="208" width="16" height="620" fill="#1a1c20" fill-opacity=".08"/><circle cx="68" cy="208" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="68" y="216" font-size="22" font-weight="700" fill="#1a1c20" text-anchor="middle">01</text><text x="132" y="204" font-size="27" font-weight="700" fill="#1a1c20" text-anchor="start">대사 노드</text><text x="132" y="240" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">대본을 붙여 넣거나 직접 적어요</text><circle cx="68" cy="332" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="68" y="340" font-size="22" font-weight="700" fill="#1a1c20" text-anchor="middle">02</text><text x="132" y="328" font-size="27" font-weight="700" fill="#1a1c20" text-anchor="start">화자 나누기</text><text x="132" y="364" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">줄마다 화자 이름이 색 태그로 붙어요</text><circle cx="68" cy="456" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="68" y="464" font-size="22" font-weight="700" fill="#1a1c20" text-anchor="middle">03</text><text x="132" y="452" font-size="27" font-weight="700" fill="#1a1c20" text-anchor="start">목소리 고르기</text><text x="132" y="488" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">화자마다 목소리를 정해요</text><circle cx="68" cy="580" r="36" fill="#ffffff" stroke="#ff6600" stroke-width="3"/><text x="68" y="588" font-size="22" font-weight="700" fill="#b93901" text-anchor="middle">04</text><text x="132" y="576" font-size="27" font-weight="700" fill="#b93901" text-anchor="start">AI 연기 지시</text><text x="132" y="612" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">줄마다 말투와 쉼, 소리를 제안해요</text><circle cx="68" cy="704" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="68" y="712" font-size="22" font-weight="700" fill="#1a1c20" text-anchor="middle">05</text><text x="132" y="700" font-size="27" font-weight="700" fill="#1a1c20" text-anchor="start">만들고 듣기</text><text x="132" y="736" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">마음에 안 드는 줄만 다시 만들어요</text><circle cx="68" cy="828" r="36" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="68" y="836" font-size="22" font-weight="700" fill="#1a1c20" text-anchor="middle">06</text><text x="132" y="824" font-size="27" font-weight="700" fill="#1a1c20" text-anchor="start">타임라인</text><text x="132" y="860" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">고른 음성을 컷에 넣어요</text></svg>