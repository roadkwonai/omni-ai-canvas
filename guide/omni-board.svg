<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 712" width="1280" height="712" role="img" aria-labelledby="omni-board-title omni-board-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="omni-board-title">여러 AI 모델을 한 보드에서 써요</title><desc id="omni-board-desc">글과 기획, 이미지, 영상, 대사 음성, 음악과 효과음, 3D 장면에 쓰는 도구가 보드 하나에 모이고 그 자료로 완성 영상과 다음 작품을 만듭니다.</desc><rect width="1280" height="712" fill="#ffffff"/><text x="64" y="72" font-size="34" font-weight="700" fill="#1a1c20" text-anchor="start">여러 AI 모델을 한 보드에서 써요</text><text x="64" y="108" font-size="20" font-weight="400" fill="#555d6d" text-anchor="start">어떤 모델을 써도 자료와 고른 결과가 한 보드에 남아요</text><rect x="64" y="148" width="424" height="72" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="84" y="191" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="start">글과 기획</text><text x="468" y="191" font-size="15" font-weight="400" fill="#555d6d" text-anchor="end">Codex · Claude · Antigravity</text><path d="M488 184L560 184" stroke="#555d6d" stroke-width="2" fill="none"/><polyline points="550,178 560,184 550,190" fill="none" stroke="#555d6d" stroke-width="2"/><rect x="64" y="236" width="424" height="72" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="84" y="279" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="start">이미지</text><text x="468" y="267" font-size="15" font-weight="400" fill="#555d6d" text-anchor="end">Codex · Higgsfield · Kling · Topview</text><text x="468" y="291" font-size="15" font-weight="400" fill="#555d6d" text-anchor="end">OpenAI · Gemini · Seedream</text><path d="M488 272L560 272" stroke="#555d6d" stroke-width="2" fill="none"/><polyline points="550,266 560,272 550,278" fill="none" stroke="#555d6d" stroke-width="2"/><rect x="64" y="324" width="424" height="72" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="84" y="367" font-size="20" font-weight="700" fill="#1a1c20" text-anchor="start">영상</te