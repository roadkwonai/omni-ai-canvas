<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 376" width="320" height="376" role="img" aria-labelledby="timeline-anatomy-narrow-title timeline-anatomy-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="timeline-anatomy-narrow-title">타임라인의 세 줄</title><desc id="timeline-anatomy-narrow-desc">컷, 음향, 자막이 같은 시간을 나눠 씁니다. 디졸브를 넣으면 두 컷이 겹친 만큼 전체 길이가 줄어듭니다. 3초 컷 두 개에 0.5초 디졸브를 넣으면 5.5초입니다.</desc><rect width="320" height="376" fill="#ffffff"/><path d="M16.0 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="16.0" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="start">0초</text><path d="M68.36363636363637 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="68.36363636363637" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">1초</text><path d="M120.72727272727273 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="120.72727272727273" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">2초</text><path d="M173.0909090909091 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="173.0909090909091" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">3초</text><path d="M225.45454545454547 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="225.45454545454547" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">4초</text><path d="M277.8181818181818 34V330" stroke="#d1d3d8" stroke-width="1"/><text x="277.8181818181818" y="24" font-size="13" font-weight="400" fill="#555d6d" text-anchor="middle">5초</text><text x="16" y="62" font-size="15" font-weight="700" fill="#1a1c20" text-anchor="start">컷</text><rect x="16.0" y="72" width="157.0909090909091" height="46" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="146.9090909090909" y="72" width="157.0909090909091" height="46" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="146.9090909090909" y="72" width="26.181818181818183" height="46" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="73.60000000000001" y="101" font-size="15" font-weight="600" fill="#1a1c20" text-anchor="middle">컷 1 · 3초</text><text x="241.16363636363636" y="101" font-size="15" font-weight="600" fill="#1a1c20" text-anchor="middle">컷 2 · 3초</text><text x="160.0" y="138" font-size="13" font-weight="600" fill="#b93901" text-anchor="middle">디졸브 0.5초</text><text x="16" y="170" font-size="15" font-weight="700" fill="#1a1c20" text-anchor="start">음향</text><rect x="26.472727272727276" y="180" width="104.72727272727273" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><rect x="99.7818181818182" y="220" width="193.74545454545458" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="78.83636363636364" y="203" font-size="14" font-weight="600" fill="#1a1c20" text-anchor="middle">대사</text><text x="194.03636363636363" y="243" font-size="14" font-weight="600" fill="#1a1c20" text-anchor="middle">음악</text><text x="16" y="284" font-size="15" font-weight="700" fill="#1a1c20" text-anchor="start">자막</text><rect x="26.472727272727276" y="294" width="36.654545454545456" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="44.800000000000004" y="317" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">오늘이</text><rect x="65.74545454545455" y="294" width="47.12727272727273" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="89.30909090909091" y="317" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">마지막</text><rect x="115.4909090909091" y="294" width="47.12727272727273" height="34" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="139.05454545454546" y="317" font-size="13" font-weight="600" fill="#1a1c20" text-anchor="middle">필름</text><text x="16" y="360" font-size="16" font-weight="700" fill="#b93901" text-anchor="start">3초 + 3초 − 0.5초 = 5.5초</text></svg>