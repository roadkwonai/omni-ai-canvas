<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 524" width="320" height="524" role="img" aria-labelledby="line-state-narrow-title line-state-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="line-state-narrow-title">대화 줄의 상태</title><desc id="line-state-narrow-desc">고친 줄과 실패한 줄만 다시 만들고 나머지 줄은 그대로 쓴다.</desc><rect width="320" height="524" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">새 줄</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">아직 음성이 없어요</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><text x="176" y="90" font-size="14" font-weight="400" fill="#1a1c20">대화 만들기</text><rect x="1" y="106" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">만드는 중</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">Drama 3</text><path d="M18 166V183H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="188" font-size="14" font-weight="400" fill="#555d6d">오류 → 실패</text><path d="M160 196V230" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 223L160 232L166 223Z" fill="#1a1c20"/><text x="176" y="218" font-size="14" font-weight="400" fill="#1a1c20">성공</text><rect x="1" y="234" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="259" font-size="17" font-weight="700" fill="#1a1c20">완성</text><text x="16" y="280" font-size="14" font-weight="400" fill="#555d6d">바로 들을 수 있어요</text><path d="M160 294V328" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 321L160 330L166 321Z" fill="#1a1c20"/><text x="176" y="316" font-size="14" font-weight="400" fill="#1a1c20">글·지시 수정</text><rect x="1" y="332" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="357" font-size="17" font-weight="700" fill="#1a1c20">고침</text><text x="16" y="378" font-size="14" font-weight="400" fill="#555d6d">다시 만들 줄이에요</text><path d="M18 392V409H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="414" font-size="14" font-weight="400" fill="#555d6d">바뀐 줄 → 만드는 중</text><rect x="1" y="434" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="459" font-size="17" font-weight="700" fill="#1a1c20">실패</text><text x="16" y="480" font-size="14" font-weight="400" fill="#555d6d">그 줄만 다시 만들어요</text><path d="M18 494V511H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="516" font-size="14" font-weight="400" fill="#555d6d">다시 → 만드는 중</text></svg>
