<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" role="img" aria-labelledby="reference-flow-title reference-flow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="reference-flow-title">레퍼런스에서 프리셋까지</title><desc id="reference-flow-desc">컷 경계가 틀리면 직접 보정하고 다시 분석한다.</desc><rect width="540" height="400" fill="#ffffff"/><style>
