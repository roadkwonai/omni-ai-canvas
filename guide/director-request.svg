<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 400" width="546" height="400" role="img" aria-labelledby="director-request-title director-request-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="director-request-title">촬영안을 만들고 적용하는 순서</title><desc id="director-request-desc">제작안은 미리보기에서 확인한 뒤 적용한다. 검토는 원문과 수정안을 비교해 고른 것만 적용한다.</desc><rect width="546" height="400" fill="#ffffff"/><style>
.c-mask{fill:#ffffff} .c-frontend{fill:#fff2ec;stroke:#ff6600} .c-backend{fill:#ffffff;stroke:#1a1c20}
.c-cloud,.c-database,.c-external,.c-messagebus{fill:#ffffff;stroke:#d1d3d8} .c-security{fill:#f3f4f5;stroke:#555d6d;stroke-dasharray:5 4}
.c-lane,.c-group,.c-phase{fill:none;stroke:#d1d3d8;stroke-dasharray:4 5}
.a-default,.a-dashed,.a-security{stroke:#555d6d;fill:none} .a-emphasis{stroke:#1a1c20;fill:none} .a-dashed{stroke-dasharray:5 4}
.m-default,.m-dashed,.m-security{fill:#555d6d} .m-emphasis{fill:#1a1c20}
text{fill:#555d6d;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}
.t-primary{fill:#1a1c20;font-size:17px;font-weight:700} .t-muted{font-size:13.5px} [data-node-id] text{stroke:none}
.t-edge,.t-edge-emphasis{fill:#1a1c20}
</style><g transform="translate(-16 -28)">
