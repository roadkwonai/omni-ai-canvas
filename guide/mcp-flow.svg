<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553 276" width="553" height="276" role="img" aria-labelledby="mcp-flow-title mcp-flow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="mcp-flow-title">외부 에이전트가 노드를 더하는 순서</title><desc id="mcp-flow-desc">읽은 뒤 보드가 바뀌었으면 추가하지 않고 다시 읽게 한다.</desc><rect width="553" height="276" fill="#ffffff"/><style>
.c-mask{fill:#ffffff} .c-frontend{fill:#fff2ec;stroke:#ff6600} .c-backend{fill:#ffffff;stroke:#1a1c20}
