<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1600" width="640" height="1600" role="img" aria-labelledby="omni-board-narrow-title omni-board-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="omni-board-narrow-title">여러 AI 모델을 한 보드에서 써요</title><desc id="omni-board-narrow-desc">글과 기획, 이미지, 영상, 대사 음성, 음악과 효과음, 3D 장면에 쓰는 도구가 보드 하나에 모이고 그 자료로 완성 영상과 다음 작품을 만듭니다.</desc><rect width="640" height="1600" fill="#ffffff"/><text x="32" y="64" font-size="34" font-weight="700" fill="#1a1c20" text-anchor="start">여러 AI 모델을 한 보드에서 써요</text><text x="32" y="104" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">어떤 모델을 써도</text><text x="32" y="134" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">자료와 고른 결과가 한 보드에 남아요</text><rect x="32" y="164" width="576" height="102" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="56" y="206" font-size="26" font-weight="700" fill="#1a1c20" text-anchor="start">글과 기획</text><text x="56" y="242" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">Codex · Claude · Antigravity</text><rect x="32" y="278" width="576" height="132" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="56" y="320" font-size="26" font-weight="700" fill="#1a1c20" text-anchor="start">이미지</text><text x="56" y="356" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">Codex · Higgsfield · Kling · Topview</text><text x="56" y="386" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">OpenAI · Gemini · Seedream</text><rect x="32" y="422" width="576" height="102" rx="8" fill="#ffffff" stroke="#d1d3d8" stroke-width="1.5"/><text x="56" y="464" font-size="26" font-weight="700" fill="#1a1c20" text-anchor="start">영상</text><text x="56" y="500" font-size="22" font-weight="400" fill="#555d6d" text-anchor="start">Higgsfield · Kling · Topview</text><rect x="32" y="536" width="576" height="132" rx="8" fill="#ffffff" stro