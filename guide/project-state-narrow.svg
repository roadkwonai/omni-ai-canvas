<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 378" width="320" height="378" role="img" aria-labelledby="project-state-narrow-title project-state-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="project-state-narrow-title">프로젝트 상태</title><desc id="project-state-narrow-desc">보관하거나 삭제해도 보드와 실행 기록은 남는다. 완전히 지우는 기능은 없다.</desc><rect width="320" height="378" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">작업 중</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">열고 고칠 수 있어요</text><path d="M18 68V85H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="90" font-size="14" font-weight="400" fill="#555d6d">삭제 확인 → 휴지통</text><path d="M160 98V132" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 125L160 134L166 125Z" fill="#1a1c20"/><text x="176" y="120" font-size="14" font-weight="400" fill="#1a1c20">보관</text><rect x="1" y="136" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="161" font-size="17" font-weight="700" fill="#1a1c20">보관함</text><text x="16" y="182" font-size="14" font-weight="400" fill="#555d6d">복구하면 열려요</text><path d="M18 196V213H30" fill="none" stroke="#555d6d" stroke-width="1.5"/><text x="36" y="218" font-size="14" font-weight="400" fill="#555d6d">복구 → 작업 중</text><path d="M160 226V260" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 253L160 262L166 253Z" fill="#1a1c20"/><text x="176" y="248" font-size="14" font-weight="400" fill="#1a1c20">삭제 확인</text><rect x="1" y="264" width="318" height="58" rx="8" fill="#f3f4f5" stroke="#555d6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="289" font-size="17" font-weight="700" fill="#1a1c20">휴지통</text><text x="16" y="310" font-size="14" font-weight="400" fill="#555d6d">복구만 할 수 있어요</text><path d="M18 324V341H30" fill="none" str