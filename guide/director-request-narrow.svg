<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 642" width="320" height="642" role="img" aria-labelledby="director-request-narrow-title director-request-narrow-desc" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif"><title id="director-request-narrow-title">촬영안을 만들고 적용하는 순서</title><desc id="director-request-narrow-desc">제작안은 미리보기에서 확인한 뒤 적용한다. 검토는 원문과 수정안을 비교해 고른 것만 적용한다.</desc><rect width="320" height="642" fill="#ffffff"/><rect x="1" y="8" width="318" height="58" rx="8" fill="#fff2ec" stroke="#ff6600" stroke-width="1.5"/><text x="16" y="33" font-size="17" font-weight="700" fill="#1a1c20">제작안 요청</text><text x="16" y="54" font-size="14" font-weight="400" fill="#555d6d">아이디어와 씬 수</text><path d="M160 68V102" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 95L160 104L166 95Z" fill="#1a1c20"/><rect x="1" y="106" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="131" font-size="17" font-weight="700" fill="#1a1c20">실행 기록</text><text x="16" y="152" font-size="14" font-weight="400" fill="#555d6d">결과를 기다려요</text><path d="M160 166V200" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 193L160 202L166 193Z" fill="#1a1c20"/><text x="176" y="188" font-size="14" font-weight="400" fill="#1a1c20">완료</text><rect x="1" y="204" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="229" font-size="17" font-weight="700" fill="#1a1c20">미리보기</text><text x="16" y="250" font-size="14" font-weight="400" fill="#555d6d">씬과 연결 확인</text><path d="M160 264V298" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 291L160 300L166 291Z" fill="#1a1c20"/><text x="176" y="286" font-size="14" font-weight="400" fill="#1a1c20">확인</text><rect x="1" y="302" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="327" font-size="17" font-weight="700" fill="#1a1c20">결과 적용</text><text x="16" y="348" font-size="14" font-weight="400" fill="#555d6d">노드가 생겨요</text><rect x="1" y="380" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="405" font-size="17" font-weight="700" fill="#1a1c20">검토 요청</text><text x="16" y="426" font-size="14" font-weight="400" fill="#555d6d">대본·연출 검토</text><path d="M160 440V474" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 467L160 476L166 467Z" fill="#1a1c20"/><rect x="1" y="478" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="503" font-size="17" font-weight="700" fill="#1a1c20">제안 비교</text><text x="16" y="524" font-size="14" font-weight="400" fill="#555d6d">최대 8건</text><path d="M160 538V572" stroke="#1a1c20" stroke-width="1.8"/><path d="M154 565L160 574L166 565Z" fill="#1a1c20"/><rect x="1" y="576" width="318" height="58" rx="8" fill="#ffffff" stroke="#1a1c20" stroke-width="1.5"/><text x="16" y="601" font-size="17" font-weight="700" fill="#1a1c20">고른 제안 적용</text><text x="16" y="622" font-size="14" font-weight="400" fill="#555d6d">본문만 바뀌어요</text></svg>
