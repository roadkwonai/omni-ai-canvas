<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
<title id="workflow-title">공모전 또는 아이디어에서 영상까지</title>
<desc id="workflow-desc">공모전 URL과 선택 아이디어를 바탕으로 샷과 제작 자료를 구성하고 영상과 음악을 만든 뒤 편집해 납품합니다.</desc>
  <defs>
      <style>#workflow-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#workflow-root .diagram-container { overflow-x:visible }
}</style>
  </defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="80" y="94" font-family="Pretendard, sans-serif" font-size="34" font-weight="700" fill="#1a1c20">공모전 또는 아이디어에서 영상까지</text>
<text x="80" y="134" font-family="Pretendard, sans-serif" font-size="20" fill="#555d6d">공고와 제작안을 검토하며 장면을 완성합니다</text>
<g aria-hidden="true">
<rect x="80" y="240" width="224" height="48" fill="#2d3142" fill-opacity="0.05" data-role="rail" data-step="idea" data-index="1"/>
<rect x="304" y="240" width="224" height="48" fill="#2d3142" fill-opacity="0.09" data-role="rail" data-step="direction" data-index="2"/>
<rect x="528" y="240" width="224" height="48" fill="#b93901" fill-opacity="0.10" data-role="rail" data-step="shot" data-index="3" data-focal="true"/>
<rect x="752" y="240" width="224" height="48" fill="#2d3142" fill-opacity="0.09" data-role="rail" data-step="generate" data-index="4"/>
<rect x="976" y="240" width="224" height="48" fill="#2d3142" fill-opacity="0.05" data-role="rail" data-step="review" data-index="5"/>
<circle cx="192" cy="264" r="36" fill="#f5f5f5" stroke="#2d3142" data-role="medallion" data-step="idea"/>
<circle cx="416" cy="264" r="36" fill="#f5f5f5" stroke="#2d3142" data-role="medallion" data-step="direction"/>
<circle cx="640" cy="264" r="36" fill="#f5f5f5" stroke="#b93901" data-role="medallion" data-step="shot" data-focal="true"/>
<circle cx="864" cy="264" r="36" fill="#f5f5f5" stroke="#2d3142" data-role="medallion" data-step="generate"/>
<circle cx="1088" cy="264" r="36" fill="#f5f5f5" stroke="#2d3142" data-role="medallion" data-step="review"/>
</g>
<g font-family="Geist, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#2d3142">
<text x="192" y="270" data-role="number" data-step="idea">01</text><text x="416" y="270" data-role="number" data-step="direction">02</text><text x="640" y="270" data-role="number" data-step="shot">03</text><text x="864" y="270" data-role="number" data-step="generate">04</text><text x="1088" y="270" data-role="number" data-step="review">05</text>
</g>
<g font-family="Pretendard, sans-serif" text-anchor="middle" fill="#1a1c20" font-size="23" font-weight="700">
<text x="192" y="365">공모전 · 아이디어</text><text x="416" y="365">샷 기획</text><text x="640" y="365">대본과 자료</text><text x="864" y="365">영상 · 음악</text><text x="1088" y="365">편집 · 납품</text>
</g>
<g font-family="Pretendard, sans-serif" text-anchor="middle" fill="#555d6d" font-size="18">
<text x="192" y="407">URL · 선택 아이디어</text><text x="416" y="407">구조 · 장면 · 동선</text><text x="640" y="407">대본 · 인물 · 참조</text><text x="864" y="407">제공자 · 로컬 엔진</text><text x="1088" y="407">프리비즈 · MP4</text>
</g>
</svg>
